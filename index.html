<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Proposições - Helano Segundo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --roxo:#2D00C8;
      --roxo-escuro:#18006E;
      --verde:#C9FF1F;
      --verde-suave:#ECFFC1;
      --bg:#F6F5FF;
      --texto:#111827;
      --borda:#DDD8F5;
      --card:#FFFFFF;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at top left, rgba(201,255,31,.18), transparent 32%), linear-gradient(180deg,#F8F7FF 0%,#F1F0FA 100%); color:var(--texto); font-family:Arial, Helvetica, sans-serif; }
    header.app {
      background:linear-gradient(135deg,var(--roxo-escuro) 0%,var(--roxo) 68%,#4B16FF 100%);
      color:white;
      padding:22px 18px;
      border-bottom:5px solid var(--verde);
      box-shadow:0 10px 30px rgba(45,0,200,.18);
    }
    .brand-wrap { max-width:1220px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:22px; }
    .brand-copy { text-align:left; }
    .brand-kicker { display:inline-flex; align-items:center; gap:8px; background:rgba(201,255,31,.14); color:var(--verde); border:1px solid rgba(201,255,31,.5); padding:6px 10px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px; }
    header.app h1 { margin:0; font-size:28px; line-height:1.1; }
    header.app p { margin:8px 0 0; font-size:14px; opacity:.92; max-width:720px; }
    .brand-logo {
  background: transparent;
  border-radius: 0;
  padding: 0;
  width: 190px;
  min-width: 150px;
  box-shadow: none;
}

.brand-logo img {
  display: block;
  width: 100%;
  height: auto;
}
    main { max-width:1220px; margin:20px auto; padding:0 14px; display:grid; grid-template-columns:410px 1fr; gap:18px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--borda); border-radius:18px; box-shadow:0 10px 30px rgba(45,0,200,.08); overflow:hidden; }
    .card h2 { margin:0; padding:14px 16px; background:#F0F8FF; border-bottom:1px solid var(--borda); font-size:17px; color:var(--roxo-escuro); }
    form { padding:16px; }
    label { display:block; margin:0 0 6px; font-size:13px; font-weight:700; }
    input, select, textarea { width:100%; border:1px solid var(--borda); border-radius:10px; padding:10px; font:14px Arial, Helvetica, sans-serif; outline:none; transition:border-color .15s, box-shadow .15s; }
    input:focus, select:focus, textarea:focus { border-color:var(--roxo); box-shadow:0 0 0 3px rgba(45,0,200,.12); }
    textarea { min-height:88px; resize:vertical; line-height:1.35; }
    .field { margin-bottom:12px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .hint { font-size:12px; color:#6b7280; margin-top:4px; }
    .style-tools { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
    .style-tools button { padding:5px 9px; border-radius:7px; font-size:12px; line-height:1; background:#F0F8FF; color:var(--roxo-escuro); border:1px solid var(--borda); box-shadow:none; }
    .style-tools button:hover { border-color:var(--roxo); box-shadow:0 0 0 2px rgba(45,0,200,.08); }
    .style-tools .tiny-primary { background:var(--roxo); color:white; border-color:var(--roxo); }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    button { border:0; border-radius:999px; padding:11px 15px; font-weight:700; cursor:pointer; }
    .primary { background:var(--roxo); color:white; box-shadow:0 8px 18px rgba(45,0,200,.22); }
    .secondary { background:var(--verde); color:var(--roxo-escuro); }
    .preview-area { padding:16px; overflow:auto; }
    .page { width:794px; height:1123px; margin:0 auto 18px; background:white; position:relative; box-shadow:0 5px 18px rgba(0,0,0,.18); font-family:Arial, Helvetica, sans-serif; color:#111; }
    .page img.header { position:absolute; left:0; top:0; width:794px; height:126px; object-fit:cover; }
    .page img.footer { position:absolute; left:0; bottom:0; width:794px; height:98px; object-fit:cover; }
    .footer-text { position:absolute; left:40px; right:40px; bottom:70px; text-align:center; font-size:12px; line-height:1.2; }
    .content { position:absolute; left:84px; right:84px; top:176px; bottom:130px; font-size:16px; line-height:1.55; }
    .doc-title { text-align:center; font-size:16px; margin-bottom:34px; font-weight:700; }
    .ementa { width:360px; margin-left:auto; margin-bottom:44px; text-align:justify; line-height:1.25; }
    .paragraph { text-align:justify; text-indent:44px; margin:0 0 12px; }
    .plenario { text-align:center; font-weight:700; margin-top:48px; font-size:15px; }
    .sig { position:absolute; left:0; right:0; bottom:185px; text-align:center; font-size:15px; line-height:1.7; }
    .sig strong { font-weight:700; }
    .just-title { text-align:center; text-decoration:none; font-size:16px; margin:0 auto 42px; display:table; border-bottom:1px solid #111; padding-bottom:3px; line-height:1.05; }
    .just .content { top:160px; }
    .just .paragraph { text-indent:42px; margin-bottom:10px; line-height:1.35; }
    @media(max-width:980px) { main { grid-template-columns:1fr; } .brand-wrap { flex-direction:column-reverse; align-items:flex-start; } .brand-logo { width:160px; } .page { transform:scale(.82); transform-origin:top center; margin-bottom:-170px; } }
  </style>
</head>
<body>
<header class="app">
  <div class="brand-wrap">
    <div class="brand-copy">
      <div class="brand-kicker">Sistema interno do mandato</div>
      <h1>Gabinete do Vereador Helano Segundo</h1>
      <p>Gerador de proposições legislativas</p>
    </div>
    <div class="brand-logo"><img src="logo.png" alt="Logomarca Helano Segundo"></div>
  </div>
</header>
<main>
  <section class="card">
    <h2>Preenchimento</h2>
    <form id="form">
      <div class="grid2">
        <div class="field"><label>Tipo</label><select id="tipo"><option value="" selected disabled>Escolha o tipo</option><option>Indicação</option><option>Requerimento</option><option>Moção</option></select></div>
        <div class="field"><label>Número</label><input id="numero" value="_____/2026"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Data</label><input type="date" id="data"></div>
        <div class="field"><label>Partido</label><input id="partido" value="PP"></div>
      </div>
      <div class="field"><label>Destinatário ou órgão</label><input id="destinatario" value="">
      </div>
      <div class="field"><label>Ementa</label><textarea id="ementa">Adicione uma ementa</textarea>
        <div class="style-tools"><button type="button" onclick="aplicarEstiloSelecionado('ementa','strong')"><b>B</b></button><button type="button" onclick="aplicarEstiloSelecionado('ementa','em')"><i>I</i></button><button type="button" onclick="aplicarEstiloSelecionado('ementa','u')"><u>S</u></button></div>
      </div>
      <div class="field"><label>Texto principal</label><textarea id="textoPrincipal">Adicione o texto</textarea>
        <div class="style-tools"><button type="button" onclick="aplicarEstiloSelecionado('textoPrincipal','strong')"><b>B</b></button><button type="button" onclick="aplicarEstiloSelecionado('textoPrincipal','em')"><i>I</i></button><button type="button" onclick="aplicarEstiloSelecionado('textoPrincipal','u')"><u>S</u></button></div>
        <div class="hint">Use aqui o pedido central da proposição.</div>
      </div>
      <div class="field"><label>Justificativa</label><textarea id="justificativa" style="min-height:180px">Adicione uma justificativa</textarea>
        <div class="style-tools"><button type="button" onclick="aplicarEstiloSelecionado('justificativa','strong')"><b>B</b></button><button type="button" onclick="aplicarEstiloSelecionado('justificativa','em')"><i>I</i></button><button type="button" onclick="aplicarEstiloSelecionado('justificativa','u')"><u>S</u></button></div>
      </div>
      <div class="actions"><button type="button" class="primary" onclick="gerarPDF()">Gerar PDF</button><button type="button" class="secondary" onclick="copiarTexto()">Copiar texto</button></div>
    </form>
  </section>
  <section class="card">
    <h2>Prévia</h2>
    <div class="preview-area" id="preview"></div>
  </section>
</main>

const AUTOR_FIXO='ANTONIO HELANO V. DA S. SEGUNDO';
const campos=['tipo','numero','data','partido','destinatario','ementa','textoPrincipal','justificativa'];
const camposEditaveis=['ementa','textoPrincipal','justificativa'];
const estiloState={ementa:[],textoPrincipal:[],justificativa:[]};

function v(id){return document.getElementById(id).value.trim();}
function raw(id){return document.getElementById(id).value || '';}
function dataExtenso(){
  const iso=v('data');
  if(!iso) return '____ DE __________ DE 2026';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
}
function esc(s){
  return (s||'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'",'&#039;');
}
function dados(){
  return {
    tipo:v('tipo'),
    numero:v('numero'),
    autor:AUTOR_FIXO,
    partido:v('partido'),
    destinatario:v('destinatario'),
    ementa:raw('ementa'),
    texto:raw('textoPrincipal'),
    just:raw('justificativa')
  };
}

function limparRangesInvalidos(id){
  const len=raw(id).length;
  estiloState[id]=estiloState[id].filter(r=>r.start<r.end && r.start<len).map(r=>({
    start:Math.max(0,Math.min(r.start,len)),
    end:Math.max(0,Math.min(r.end,len)),
    tag:r.tag
  })).filter(r=>r.start<r.end);
}

function selecaoTemEstiloCompleto(id, ini, fim, tag){
  const ranges = estiloState[id] || [];
  for(let i=ini; i<fim; i++){
    if(!ranges.some(r => r.tag===tag && i>=r.start && i<r.end)) return false;
  }
  return true;
}
function removerEstiloIntervalo(id, ini, fim, tag){
  const novos=[];
  (estiloState[id] || []).forEach(r=>{
    if(r.tag!==tag || r.end<=ini || r.start>=fim){
      novos.push(r);
      return;
    }
    if(r.start<ini) novos.push({start:r.start,end:ini,tag:r.tag});
    if(r.end>fim) novos.push({start:fim,end:r.end,tag:r.tag});
  });
  estiloState[id]=novos;
}
function aplicarEstiloSelecionado(id, tag){
  const el=document.getElementById(id);
  const ini=el.selectionStart, fim=el.selectionEnd;
  if(ini===fim){ el.focus(); return; }

  const jaAplicado = selecaoTemEstiloCompleto(id, ini, fim, tag);
  removerEstiloIntervalo(id, ini, fim, tag);
  if(!jaAplicado){
    estiloState[id].push({start:ini,end:fim,tag});
  }

  el.focus();
  el.setSelectionRange(ini,fim);
  render();
}

function estilosNoIndice(id, index){
  const ranges=estiloState[id] || [];
  return {
    bold:ranges.some(r=>r.tag==='strong' && index>=r.start && index<r.end),
    italic:ranges.some(r=>r.tag==='em' && index>=r.start && index<r.end),
    underline:ranges.some(r=>r.tag==='u' && index>=r.start && index<r.end)
  };
}
function classeEstilo(st){
  const cls=[];
  if(st.bold) cls.push('font-weight:700');
  if(st.italic) cls.push('font-style:italic');
  if(st.underline) cls.push('text-decoration:underline');
  return cls.join(';');
}
function styledHTML(id, start=0, end=null){
  limparRangesInvalidos(id);
  const texto=raw(id);
  if(end===null) end=texto.length;
  let out='', buffer='', atual=null;
  function flush(){
    if(!buffer) return;
    const safe=esc(buffer).replaceAll('\n','<br>');
    const style=atual ? classeEstilo(atual) : '';
    out += style ? `<span style="${style}">${safe}</span>` : safe;
    buffer='';
  }
  for(let i=start;i<end;i++){
    const st=estilosNoIndice(id,i);
    const key=JSON.stringify(st);
    const curKey=JSON.stringify(atual);
    if(key!==curKey){ flush(); atual=st; }
    buffer+=texto[i];
  }
  flush();
  return out;
}
function paragrafosCampo(id){
  const texto=raw(id);
  const partes=[];
  const re=/[^\n]+/g;
  let m;
  while((m=re.exec(texto))){
    const trecho=texto.slice(m.index, m.index+m[0].length);
    if(trecho.trim()) partes.push(`<p class="paragraph">${styledHTML(id,m.index,m.index+m[0].length)}</p>`);
  }
  return partes.join('');
}

function tokensCampo(id, start=0, end=null){
  limparRangesInvalidos(id);
  const texto=raw(id);
  if(end===null) end=texto.length;
  const tokens=[];
  let buf='', atual=null;
  function flush(){
    if(!buf) return;
    tokens.push({text:buf,bold:!!(atual&&atual.bold),italic:!!(atual&&atual.italic),underline:!!(atual&&atual.underline)});
    buf='';
  }
  for(let i=start;i<end;i++){
    const st=estilosNoIndice(id,i);
    const key=JSON.stringify(st);
    const curKey=JSON.stringify(atual);
    if(key!==curKey){ flush(); atual=st; }
    buf+=texto[i];
  }
  flush();
  return tokens;
}
function splitRichWords(tokens){
  const words=[];
  tokens.forEach(t=>{
    const parts=t.text.split(/(\s+)/).filter(x=>x.length);
    parts.forEach(part=>{
      if(/\s+/.test(part)) return;
      words.push({...t,text:part});
    });
  });
  return words;
}
function wordWidth(pdf,w){pdf.setFont('helvetica',tokenStyle(w)); return pdf.getTextWidth(w.text);}
function buildRichLines(pdf,tokens,w){
  const words=splitRichWords(tokens);
  const lines=[]; let line=[]; let lineW=0; const spaceW=pdf.getTextWidth(' ');
  words.forEach(word=>{
    const ww=wordWidth(pdf,word);
    const add=line.length?spaceW+ww:ww;
    if(line.length && lineW+add>w){lines.push(line); line=[word]; lineW=ww;}
    else {line.push(word); lineW+=add;}
  });
  if(line.length) lines.push(line);
  return lines;
}
function drawRichLine(pdf,line,x,y,w,justify=false){
  const widths=line.map(word=>wordWidth(pdf,word));
  const total=widths.reduce((a,b)=>a+b,0);
  const space=justify && line.length>1 ? Math.max((w-total)/(line.length-1),1.2) : pdf.getTextWidth(' ');
  let cx=x;
  line.forEach((word,i)=>{
    pdf.setFont('helvetica',tokenStyle(word));
    pdf.text(word.text,cx,y);
    if(word.underline){ pdf.line(cx,y+1,cx+widths[i],y+1); }
    cx+=widths[i]+(i<line.length-1?space:0);
  });
}
function wrapRichTokens(pdf,tokens,x,y,w,opts={}){
  pdf.setFontSize(opts.size||12);
  const lineHeight=opts.line||6;
  const lines=buildRichLines(pdf,tokens,w);
  lines.forEach((line,idx)=>{
    drawRichLine(pdf,line,x,y,w,opts.justify && idx<lines.length-1);
    y+=lineHeight;
  });
  pdf.setFont('helvetica','normal');
  return y;
}
function buildRichLinesWithFirstIndent(pdf,tokens,w,firstW){
  const words=splitRichWords(tokens);
  const lines=[];
  let line=[];
  let lineW=0;
  const spaceW=pdf.getTextWidth(' ');
  words.forEach(word=>{
    const maxW = lines.length === 0 ? firstW : w;
    const ww=wordWidth(pdf,word);
    const add=line.length?spaceW+ww:ww;
    if(line.length && lineW+add>maxW){
      lines.push(line);
      line=[word];
      lineW=ww;
    } else {
      line.push(word);
      lineW+=add;
    }
  });
  if(line.length) lines.push(line);
  return lines;
}
function wrapRichParagraphTokens(pdf,tokens,x,y,w,opts={}){
  pdf.setFontSize(opts.size||12);
  const lineHeight=opts.line||6;
  const indent=opts.firstLineIndent||0;
  const firstW=Math.max(w-indent,20);
  const lines=buildRichLinesWithFirstIndent(pdf,tokens,w,firstW);
  lines.forEach((line,idx)=>{
    const isFirst=idx===0;
    const lx=isFirst ? x+indent : x;
    const lw=isFirst ? firstW : w;
    drawRichLine(pdf,line,lx,y,lw,opts.justify && idx<lines.length-1);
    y+=lineHeight;
  });
  pdf.setFont('helvetica','normal');
  return y;
}
function paragraphRanges(id){
  const texto=raw(id);
  const ranges=[];
  const re=/[^\n]+/g;
  let m;
  while((m=re.exec(texto))){
    if(m[0].trim()) ranges.push([m.index,m.index+m[0].length]);
  }
  return ranges;
}

async function gerarPDF(){
  const {jsPDF}=window.jspdf;
  if(!window.html2canvas){
    alert('A biblioteca de geração visual do PDF ainda não carregou. Recarregue a página e tente novamente.');
    return;
  }

  render();
  if(document.fonts && document.fonts.ready){
    await document.fonts.ready;
  }

  const d=dados();
  const paginas=Array.from(document.querySelectorAll('#preview .page'));
  const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});

  for(let i=0;i<paginas.length;i++){
    const pagina=paginas[i];
    const transformOriginal=pagina.style.transform;
    const marginOriginal=pagina.style.marginBottom;
    pagina.style.transform='none';
    pagina.style.marginBottom='18px';

    const canvas=await html2canvas(pagina,{
      scale:3,
      backgroundColor:'#ffffff',
      useCORS:true,
      allowTaint:true,
      logging:false,
      width:794,
      height:1123,
      windowWidth:1200
    });

    pagina.style.transform=transformOriginal;
    pagina.style.marginBottom=marginOriginal;

    if(i>0) pdf.addPage();
    const imagem=canvas.toDataURL('image/png');
    pdf.addImage(imagem,'PNG',0,0,210,297,undefined,'FAST');
  }

  const tipoArquivo = stripTags(d.tipo).toLowerCase() || 'proposicao';
  const nomeBase = `${tipoArquivo}_${stripTags(d.numero).replaceAll('/','-').replaceAll(' ','_')}`;
  pdf.save(`${nomeBase}.pdf`);
}
